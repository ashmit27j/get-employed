[project]
name = "ge-scraper"
version = "0.0.0"
description = "Internal LinkedIn job scraper for GetEmployed (Scrapling + FastAPI). See docs/job-ingestion.md."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "scrapling[fetchers]>=0.4.15",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
