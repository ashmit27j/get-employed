html{scroll-behavior:smooth;scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}body{overflow-x:hidden}
.ge-track{animation:ge-marq 45s linear infinite}.ge-pebble{transition:color .25s,border-color .25s,background .25s}.ge-pebble:hover{color:var(--color-inverse-ink)!important;border-color:var(--color-inverse-canvas)!important;background:var(--color-inverse-canvas)!important}.ge-pebble>span{transition:background .25s,color .25s}.ge-pebble:hover>span{background:var(--color-inverse-surface-2)!important;color:var(--color-inverse-ink)!important}.ge-pebble:hover img{filter:brightness(0.1)}

/* Blueprint grid frame — horizontal full-bleed rules, hatched gutters, column hairlines */
:root{
 --ge-line:color-mix(in srgb,var(--color-hairline-strong) 70%,transparent);
 --ge-hatch:color-mix(in srgb,var(--color-hairline-strong) 55%,transparent);
 --ge-rail:clamp(16px,1.6vw + 8px,40px);
 --ge-edge:clamp(0px,5vw - 38px,72px);
 --ge-col:min(1280px,100vw - 2*var(--ge-rail) - 2*var(--ge-edge));
}
.ge-frame{position:relative;overflow-x:clip}
.ge-frame[data-rule]::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--ge-line);pointer-events:none;z-index:1}
.ge-col{position:relative;width:var(--ge-col);margin:0 auto;box-sizing:border-box}
.ge-col::before,.ge-col::after{content:"";position:absolute;top:0;bottom:0;width:var(--ge-rail);box-sizing:border-box;border-left:1px solid var(--ge-line);border-right:1px solid var(--ge-line);background:repeating-linear-gradient(315deg,var(--ge-hatch) 0 1px,transparent 0 50%) 0 0/10px 10px;pointer-events:none}
.ge-col::before{right:calc(100% - 1px)}
.ge-col::after{left:calc(100% - 1px)}
.ge-col>*{position:relative}
.ge-rule{position:relative}
.ge-rule::before,.ge-rule::after{content:"";position:absolute;left:-100vw;right:-100vw;height:1px;background:var(--ge-line);pointer-events:none}
.ge-rule::before{top:0}.ge-rule::after{bottom:0}
.ge-anno{font-family:var(--font-mono);font-size:12px;line-height:1;letter-spacing:0;color:var(--color-ink-tertiary);opacity:.8;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:767px){
 :root{--ge-col:100%}
 .ge-frame{--gutter:16px}
 .ge-col::before,.ge-col::after{display:none}
 .ge-frame[data-rule]::before,.ge-rule::before,.ge-rule::after{display:none}
}

/* C02 — tertiary text contrast */
html.c02{--color-ink-tertiary:#7A818C}
html:not(.c02){--color-ink-tertiary:#646B76}

/* C03 — focus rings (off = original: none on unstyled buttons, browser default elsewhere) */
html.c03 :where(a,button,summary,[role="tab"],[tabindex]):not([data-ds-focus]):focus-visible{outline:2px solid var(--color-primary-hover)!important;outline-offset:2px!important}

<script type="text/babel">
function ScrollProgressV1(){
  const r=React.useRef(null);
  React.useEffect(()=>{let q=0;const run=()=>{q=0;const max=document.documentElement.scrollHeight-innerHeight;if(r.current)r.current.style.transform="scaleX("+(max>0?Math.min(1,scrollY/max):0)+")";};const on=()=>{if(!q)q=requestAnimationFrame(run);};run();addEventListener("scroll",on,{passive:true});addEventListener("resize",on);const ro=new ResizeObserver(on);ro.observe(document.body);return()=>{removeEventListener("scroll",on);removeEventListener("resize",on);ro.disconnect();};},[]);
  return <div ref={r} style={{position:"fixed",top:0,left:0,right:0,height:2,background:"var(--color-primary)",boxShadow:"var(--glow-underline)",transformOrigin:"0 50%",transform:"scaleX(0)",zIndex:100,pointerEvents:"none"}}></div>;
}
const ScrollProgress=pick("ScrollProgress",ScrollProgressV1);
const NAV_V1=["Jobs","Companies","Pricing","Changelog"];
const NAV_V2=["How it works","Pricing","Changelog","Self-host"]; /* C07 */
const ANCHORS={"How it works":"how","Self-host":"selfhost","Self-host guide":"selfhost"};
const FOOTER_V1=[{title:"Product",links:["Job search","Application tracker","Resume builder","Salary insights","Pricing"]},{title:"For employers",links:["Post a job","Talent search","Verified employer","Hiring plans"]},{title:"Resources",links:["Blog","Interview guides","Changelog","GitHub"]},{title:"Company",links:["About","Careers","Privacy","Terms"]}];
const FOOTER_V2=[{title:"Product",links:["Job search","Resume tailor","Outbox","Tracker","Mock interviews","Pricing"]},{title:"Open source",links:["GitHub","Self-host guide","Changelog"]},{title:"Company",links:["About","Privacy","Terms"]}]; /* C11 */
function App(){
  const { TopNav, Footer } = DS;
  const [rev,setRev]=React.useState(0);
  React.useEffect(()=>{const f=()=>setRev(v=>v+1);addEventListener("ge-changes",f);return()=>removeEventListener("ge-changes",f);},[]);
  const [page,setPage]=React.useState(()=>{const p=localStorage.getItem("ge-kit-page");return p&&p!=="signup"?p:"home";});
  const toAuth=mode=>{(window.top||window).location.href=new URL("../Auth.dc.html"+(mode?"?mode="+mode:""),location.href).href;};
  const go=p=>{if(p==="signup")return toAuth("signup");setPage(p);localStorage.setItem("ge-kit-page",p);window.scrollTo(0,0);};
  const map={home:Home,Pricing:Pricing,Changelog:Changelog,};
  const toAnchor=id=>{if(page!=="home")go("home");setTimeout(()=>{const el=document.getElementById(id);if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-56,behavior:reducedMotion()?"auto":"smooth"});},60);};
  const nav=l=>{if(ge("C07")&&ANCHORS[l])return toAnchor(ANCHORS[l]);go(map[l]?l:"home");};
  const Page=map[page]||Home;
  return (<div key={rev}>
    <ScrollProgress/>
    <TopNav links={ge("C07")?NAV_V2:NAV_V1} active={page} onNavigate={nav} onSignIn={()=>toAuth("signin")} onCta={()=>toAuth("signup")} />
    <main><Page go={go}/></main>
    {<GridFrame><Footer columns={ge("C11")?FOOTER_V2:FOOTER_V1} onLink={l=>ANCHORS[l]?toAnchor(ANCHORS[l]):map[l]?go(l):null}/></GridFrame>}
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
