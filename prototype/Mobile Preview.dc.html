<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Mobile preview · GetEmployed</title>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="_ds/getemployed-design-system-26a74c65-2299-40a0-95a1-5dba6bbc92b1/tokens/fonts.css">
<link rel="stylesheet" href="_ds/getemployed-design-system-26a74c65-2299-40a0-95a1-5dba6bbc92b1/tokens/colors.css">
<link rel="stylesheet" href="_ds/getemployed-design-system-26a74c65-2299-40a0-95a1-5dba6bbc92b1/tokens/typography.css">
<link rel="stylesheet" href="_ds/getemployed-design-system-26a74c65-2299-40a0-95a1-5dba6bbc92b1/tokens/spacing.css">
<link rel="stylesheet" href="_ds/getemployed-design-system-26a74c65-2299-40a0-95a1-5dba6bbc92b1/tokens/radius.css">
<link rel="stylesheet" href="_ds/getemployed-design-system-26a74c65-2299-40a0-95a1-5dba6bbc92b1/tokens/elevation.css">
<link rel="stylesheet" href="_ds/getemployed-design-system-26a74c65-2299-40a0-95a1-5dba6bbc92b1/tokens/base.css">
<link rel="stylesheet" href="_ds/getemployed-design-system-26a74c65-2299-40a0-95a1-5dba6bbc92b1/styles.css">
<style>body{margin:0;background:var(--color-canvas);color:var(--color-ink);font-family:var(--font-text)}a{color:var(--color-ink)}a:hover{color:var(--color-primary-hover)}</style>
</helmet>
<div style="padding:48px;display:flex;flex-direction:column;gap:32px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-size:var(--type-headline-size);font-weight:600">Mobile · 390 × 844</h1>
    <p style="margin:0;font-size:var(--type-body-sm-size);color:var(--color-ink-subtle)">Every app page below 768px: bottom tab bar, slide-in drawer from More or the menu button, single-column content.</p>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:32px">
    <sc-for list="{{ pages }}" as="p" hint-placeholder-count="6">
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="font-size:var(--type-body-sm-size);color:var(--color-ink-subtle)">{{ p.label }}</span>
        <iframe src="{{ p.src }}" title="{{ p.label }}" style="width:390px;height:844px;border:1px solid var(--color-hairline-strong);border-radius:24px;background:var(--color-canvas)"></iframe>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { pages: [["Jobs", "Jobs.dc.html"], ["Job detail", "Job%20Detail.dc.html?id=j1"], ["Tracker", "Tracker.dc.html"], ["Main resume", "Resume.dc.html?view=main"], ["Tailored resumes", "Resume.dc.html?view=list"], ["Tailor", "Resume.dc.html?view=tailor&job=j1"], ["Outbox", "Outbox.dc.html"], ["Assistant", "Assistant.dc.html"], ["Interview prep", "Interview.dc.html"], ["LinkedIn", "Profiles.dc.html?p=linkedin"], ["GitHub", "Profiles.dc.html?p=github"], ["Saved searches", "Saved%20Search.dc.html"], ["Settings", "Settings.dc.html"], ["Onboarding", "Onboarding.dc.html"]].map(([label, src]) => ({ label, src })) };
  }
}
</script>
</body>
</html>
