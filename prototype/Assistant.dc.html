                    <span style="width:16px;height:16px;background:currentColor;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/send-horizontal.svg) center/contain no-repeat"></span>

            <span style="font-size:var(--type-caption-size);color:var(--color-ink-tertiary);text-align:center">The assistant asks before sending email or booking anything.</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  scrollRef = React.createRef();
  fileRef = React.createRef();
  state = { files: [], focus: false, promptsOpen: false, draft: "", busy: false, model: "auto", modelsOpen: false, listening: false, micText: "", msgs: [
    { role: "user", text: "Find backend roles in Bengaluru that would take a 2027 grad. I'm fine with hybrid.", time: "10:02" },
    { role: "assistant", text: "I searched 4 job boards and 60 careers pages. 6 roles fit; these three match your profile best.", time: "10:02", actions: [{ icon: "search", title: "Searched jobs", detail: "Backend · Bengaluru · Hybrid or on-site · 0–2 yrs", status: "done", href: "Jobs.dc.html", cta: "Open in Jobs" }], jobsIdx: [0, 2, 3] },
    { role: "user", text: "Tailor my resume for the Razorpay one and draft an email to the hiring manager.", time: "10:04" },
    { role: "assistant", text: "Done. I rewrote 4 bullets to surface your Kafka and Go work (ATS 62 → 84) and found Ananya Krishnan, the Engineering Manager for Payments. The email is waiting in your Outbox; nothing is sent until you approve it.", time: "10:04", actions: [{ icon: "file-check", title: "Tailored resume for Backend Engineer I · Razorpay", detail: "4 rewrites to review", status: "done", href: "Resume.dc.html?tab=tailor&job=j1", cta: "Review" }, { icon: "send", title: "Drafted outreach to Ananya Krishnan", detail: "ananya.k@razorpay.com · 94% confidence", status: "done", href: "Outbox.dc.html", cta: "Open Outbox" }] },
  ] };
  componentDidMount() {
    const tid = new URLSearchParams(location.search).get("thread");
    const t = tid && window.GEApp && window.GEApp.loadThreads().find(x => x.id === tid);
    const SAMPLE = ["Job hunt, week of Sep 22", "Atlassian round 1 prep", "Why is my ATS score low?", "Stipend vs PPO offers", "Rewrite LinkedIn headline"];
    if (t) this.setState({ msgs: t.msgs, title: t.title });
    else if (tid && /^s\d$/.test(tid)) this.setState({ title: SAMPLE[+tid.slice(1)] });
    else if (new URLSearchParams(location.search).has("new")) this.setState({ msgs: [] });
    if (!window.GEData) { const t = setInterval(() => { if (window.GEData) { clearInterval(t); this.forceUpdate(); } }, 50); } this.scroll(); }
  componentDidUpdate() { this.scroll(); }
  componentWillUnmount() { clearInterval(this.iv); this.stopRecognition(); }
  startMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    this.setState({ listening: true, micText: "" });
    if (SR) {
      try {
        const r = this.rec = new SR(); r.continuous = true; r.interimResults = true;
        r.onresult = e => { let txt = ""; for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript; this.setState({ micText: txt }); };
        r.onerror = () => {};
        r.start(); return;
      } catch (e) {}
    }
    const words = "Find backend internships in Pune that accept 2027 grads".split(" "); let i = 0;
    this.micIv = setInterval(() => { i++; this.setState({ micText: words.slice(0, i).join(" ") }); if (i >= words.length) clearInterval(this.micIv); }, 180);
  }
  stopRecognition() { clearInterval(this.micIv); if (this.rec) { try { this.rec.stop(); } catch (e) {} this.rec = null; } }
  cancelMic() { this.stopRecognition(); this.setState({ listening: false, micText: "" }); }
  confirmMic() { this.stopRecognition(); this.setState(s => ({ listening: false, micText: "", draft: (s.draft ? s.draft.replace(/\s*$/, " ") : "") + s.micText })); }
  scroll() { const el = this.scrollRef.current; if (el) el.scrollTop = el.scrollHeight; }
  reply(q) {
    const t = q.toLowerCase();
    if (/interview|mock|practi/.test(t)) return { text: "Booked a 15-minute technical mock for Backend Engineer I · Razorpay, tomorrow at 19:00. I'll focus on idempotency, queues and rate limiting, since those came up in the JD.", action: { icon: "calendar-check", title: "Booked mock interview", detail: "Sep 26, 19:00 · Technical · 15 min", href: "Interview.dc.html", cta: "Prepare" } };
    if (/email|outreach|reach|draft/.test(t)) return { text: "I drafted two emails: one to Karthik Rao at Zepto and one to Priya Menon at Freshworks. Both mention a specific project and ask for a 15-minute chat.", action: { icon: "send", title: "Drafted 2 outreach emails", detail: "Waiting for your approval", href: "Outbox.dc.html", cta: "Review" } };
    if (/tailor|resume|cv/.test(t)) return { text: "I tailored your resume for SDE-1, Platform at Zepto. The main change is leading with the Redis caching result, which the JD asks about twice.", action: { icon: "file-check", title: "Tailored resume for SDE-1 · Zepto", detail: "3 rewrites · ATS 62 → 79", href: "Resume.dc.html?tab=tailor&job=j2", cta: "Review" } };
    return { text: "Here are remote roles open to freshers that match your React and Node.js experience. Postman is the strongest fit.", action: { icon: "search", title: "Searched jobs", detail: "Remote · 0–1 yrs · React or Node.js", href: "Jobs.dc.html", cta: "Open in Jobs" }, jobsIdx: [3, 2, 1] };
  }
  send(q) {
    if (!q.trim() || this.state.busy) return; this.stopRecognition();
    const r = this.reply(q), now = new Date(), time = now.getHours() + ":" + String(now.getMinutes()).padStart(2, "0");
    this.setState(s => ({ draft: "", files: [], busy: true, title: s.title || (s.msgs.length ? s.title : (q.length > 42 ? q.slice(0, 40).trim() + "…" : q)), msgs: [...s.msgs, { role: "user", text: q, time }, { role: "assistant", text: "", streaming: true, actions: [{ ...r.action, status: "running", title: r.action.title.replace(/^(\w+)/, m => ({ Searched: "Searching", Booked: "Booking", Drafted: "Drafting", Tailored: "Tailoring" }[m] || m)) + "…" }] }] }));
    let i = 0; const words = r.text.split(" ");
    setTimeout(() => {
      this.iv = setInterval(() => {
        i += 1;
        this.setState(s => { const m = [...s.msgs]; const last = { ...m[m.length - 1] }; last.text = words.slice(0, i).join(" "); last.actions = [{ ...r.action, status: "done" }]; if (i >= words.length) { last.streaming = false; last.time = time; last.jobsIdx = r.jobsIdx; } m[m.length - 1] = last; return { msgs: m, busy: i < words.length }; });
        if (i >= words.length) clearInterval(this.iv);
      }, 45);
    }, 900);
  }
  renderVals() {
    const D = window.GEData, s = this.state;
    return {
      scrollRef: this.scrollRef, draft: s.draft, busy: s.busy,
      isNew: s.msgs.length === 0,
      greet: this.greetEl || (this.greetEl = React.createElement("span", { "aria-hidden": "true", style: { display: "inline-block", padding: "0 6px 6px 0", margin: "0 -6px -6px 0", clipPath: "inset(0 100% 0 0)", animation: "ge-as-wipe .75s cubic-bezier(.65,0,.35,1) .1s forwards" } }, "What should we ", React.createElement("span", { style: { borderRadius: "2px", padding: "0 3px", margin: "0 -3px", background: "linear-gradient(rgba(123,155,219,.35),rgba(123,155,219,.35)) left center/0% 100% no-repeat", animation: "ge-as-sel .4s cubic-bezier(.65,0,.35,1) 1.1s forwards" } }, "work on"), "?")),
      crumbs: "Assistant / " + (s.msgs.length === 0 ? "New chat" : s.title || (s.msgs[0].text.length > 42 ? s.msgs[0].text.slice(0, 40).trim() + "…" : s.msgs[0].text)),
      ...(() => {
        const models = [["auto", "Auto", "Picks the best model for each task"], ["claude-sonnet", "Claude Sonnet 4.5", "Strong at writing and resume edits"], ["gpt-5", "GPT-5", "General reasoning and search"], ["gemini-pro", "Gemini 2.5 Pro", "Long job descriptions and documents"], ["fast", "Fast", "Quick answers, lower accuracy"]];
        const ic = (n, sz, c) => ({ width: sz + "px", height: sz + "px", flex: "none", color: c, background: "currentColor", mask: "url(https://unpkg.com/lucide-static@0.460.0/icons/" + n + ".svg) center/contain no-repeat" });
        const round = { all: "unset", boxSizing: "border-box", width: "32px", height: "32px", display: "inline-flex", alignItems: "center", justifyContent: "center", borderRadius: "999px", transition: "background var(--duration-base) var(--ease-standard), color var(--duration-base) var(--ease-standard)" };
